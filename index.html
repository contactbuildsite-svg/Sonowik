<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F0E" media="(prefers-color-scheme: dark)">
<title>Sonowik</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>/* ============ Tokens ============ */
:root{
  --bg:#F3F2EE;--bg2:#EAE8E2;--s1:#FFFFFF;--s2:#F0EEE9;--s3:#E4E1DA;
  --tx:#161614;--tx2:#3B3A36;--mu:#76736C;--mu2:#A19D94;
  --ln:rgba(22,22,20,.09);--ln2:rgba(22,22,20,.16);
  --ink:#161614;--on-ink:#FAF9F6;
  --up:#2E7A55;--dn:#B44A3F;--upbg:rgba(46,122,85,.1);--dnbg:rgba(180,74,63,.1);
  --gem:#6F7B8C;
  --r0:#9C988F;--r1:#5C80A6;--r2:#7F65A8;--r3:#B4587F;--r4:#C3983F;
  --shadow:0 1px 2px rgba(22,22,20,.05),0 8px 24px -12px rgba(22,22,20,.18);
  --shadow-lg:0 2px 6px rgba(22,22,20,.06),0 30px 60px -28px rgba(22,22,20,.35);
  --rad:24px;--rad-s:16px;--acc:#5757E8;--acc2:#3A3AB8;--bal:radial-gradient(130% 120% at 15% 0%,#7373F7 0%,#5151DE 42%,#2F2FA0 100%);
  --stage:radial-gradient(120% 90% at 50% 0%,#FFFFFF 0%,#E9E7E1 60%,#DEDBD3 100%);
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0C18;--bg2:#11111F;--s1:#1A1A2C;--s2:#232338;--s3:#30304A;
  --tx:#F4F4FA;--tx2:#D9D9E8;--mu:#9C9CB6;--mu2:#6B6B88;
  --ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.14);
  --ink:#FFFFFF;--on-ink:#0C0C18;--up:#4FCB9B;--dn:#F27272;--upbg:rgba(79,203,155,.13);--dnbg:rgba(242,114,114,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);--shadow-lg:0 30px 70px -30px rgba(0,0,0,.85);
  --stage:radial-gradient(120% 90% at 50% 0%,#2E2E52 0%,#1A1A2E 55%,#121222 100%);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C18;--bg2:#11111F;--s1:#1A1A2C;--s2:#232338;--s3:#30304A;
  --tx:#F4F4FA;--tx2:#D9D9E8;--mu:#9C9CB6;--mu2:#6B6B88;
  --ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.14);
  --ink:#FFFFFF;--on-ink:#0C0C18;--up:#4FCB9B;--dn:#F27272;--upbg:rgba(79,203,155,.13);--dnbg:rgba(242,114,114,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);--shadow-lg:0 30px 70px -30px rgba(0,0,0,.85);
  --stage:radial-gradient(120% 90% at 50% 0%,#2E2E52 0%,#1A1A2E 55%,#121222 100%);color-scheme:dark}

/* ============ Base ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--tx);outline-offset:3px;border-radius:6px}
::selection{background:var(--tx);color:var(--bg)}
.disp{font-stretch:118%;font-weight:800;letter-spacing:-.02em;line-height:1}
.mu{color:var(--mu)}.sm{font-size:.82rem}.xs{font-size:.72rem}
.up{color:var(--up)}.dn{color:var(--dn)}
.gem{display:inline-block;width:.78em;height:.78em;margin-left:.18em;vertical-align:-.04em;background:currentColor;clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%);opacity:.85}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ Shell ============ */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in oklab,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:9px;font-stretch:125%;font-weight:850;font-size:.98rem;letter-spacing:-.01em;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 210deg,#cfd3d9,#8d939c,#eef0f3,#9aa0a8,#cfd3d9);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 2px 6px -2px rgba(0,0,0,.3);position:relative}
.logo i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.logo span{display:none}
.sp{flex:1}
.wallet{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;background:var(--s1);border:1px solid var(--ln);font-weight:700;box-shadow:var(--shadow)}
.wallet .gem{color:var(--gem);width:.9em;height:.9em}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--on-ink);font-weight:800;font-size:.85rem}
.tsearch{display:none;flex:1;max-width:440px;position:relative}
.tsearch input{width:100%;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--s1);padding:0 14px 0 38px}
.tsearch svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--mu)}
.banner{margin:12px 16px 0;padding:9px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--ln);display:flex;gap:10px;align-items:center;font-size:.8rem;color:var(--mu);flex-wrap:wrap}
.banner b{color:var(--tx);font-weight:800;letter-spacing:.04em}
.banner a{margin-left:auto;font-weight:700;color:var(--tx);text-decoration:underline;text-underline-offset:3px}
.frame{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;padding:18px 16px 28px;max-width:1440px;margin:0 auto}
.side,.rail{display:none}
.view{display:flex;flex-direction:column;gap:30px;min-width:0}
.view.ent>*{animation:rise .5s var(--ease) both}
.view.ent>*:nth-child(2){animation-delay:.04s}.view.ent>*:nth-child(3){animation-delay:.08s}.view.ent>*:nth-child(4){animation-delay:.12s}.view.ent>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

.dock{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:6px;padding:6px;border-radius:22px;background:color-mix(in oklab,var(--s1) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--ln);box-shadow:var(--shadow-lg)}
.dock a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:16px;font-size:.68rem;font-weight:700;color:var(--mu);transition:color .2s,background .2s}
.dock a svg{width:21px;height:21px}
.dock a.on{color:var(--tx);background:var(--s2)}
.dock .pkbtn{flex:0 0 auto;width:58px;height:58px;margin:-18px 2px 0;border-radius:18px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);position:relative;overflow:hidden}
.dock .pkbtn svg{width:26px;height:26px}
.dock .pkbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);background-size:250% 100%;animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%,60%{background-position:120% 0}100%{background-position:-120% 0}}

.side{flex-direction:column;gap:2px;position:sticky;top:76px;align-self:start;max-height:calc(100vh - 92px);overflow:auto;padding-right:6px;scrollbar-width:thin}
.side a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--mu);font-weight:600;transition:background .15s,color .15s}
.side a svg{width:18px;height:18px;flex:none}
.side a:hover{background:var(--s2);color:var(--tx)}
.side a.on{background:var(--s1);color:var(--tx);box-shadow:var(--shadow)}
.side p{margin:18px 12px 6px;color:var(--mu2);font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.side .dotg{width:8px;height:8px;border-radius:50%;margin:0 5px;flex:none}
.side .open-cta{margin:4px 0 8px;justify-content:center;background:var(--ink);color:var(--on-ink)!important;font-weight:800}
.side .open-cta:hover{background:var(--ink);opacity:.9}

@media(min-width:1000px){
  body{padding-bottom:30px}.dock{display:none}.tsearch{display:block}.logo span{display:inline}
  .frame{grid-template-columns:224px minmax(0,1fr);padding:22px 28px 40px;gap:32px}.side{display:flex}}
@media(min-width:1360px){.frame{grid-template-columns:224px minmax(0,1fr) 300px}.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px;align-self:start}}

/* ============ Primitives ============ */
.h1{font-size:clamp(1.9rem,4.4vw,2.7rem)}
.h2{font-size:1.25rem;font-stretch:115%;font-weight:800;letter-spacing:-.015em}
.sec{display:flex;flex-direction:column;gap:14px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sech a,.lnk{font-size:.84rem;font-weight:700;color:var(--mu)}
.sech a:hover,.lnk:hover{color:var(--tx)}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--rad);box-shadow:var(--shadow)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:14px;background:var(--ink);color:var(--on-ink);font-weight:750;letter-spacing:.005em;white-space:nowrap;position:relative;overflow:hidden;transition:transform .15s var(--ease),opacity .2s,box-shadow .2s;box-shadow:0 6px 18px -10px rgba(0,0,0,.55)}
.btn:active{transform:scale(.97)}
.btn.sec2{background:var(--s1);color:var(--tx);border:1px solid var(--ln2);box-shadow:none}
.btn.ghost{background:transparent;color:var(--tx);box-shadow:none}
.btn.sm{height:36px;padding:0 14px;border-radius:11px;font-size:.86rem}
.btn.lg{height:54px;padding:0 26px;border-radius:16px;font-size:1.02rem}
.btn.full{width:100%}
.btn[disabled],.btn.busy{opacity:.4;pointer-events:none}
.btn .gem{opacity:.7}
.btn.busy::after{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;margin-left:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.row-acts{display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding:16px}
.chips::-webkit-scrollbar,.shelf::-webkit-scrollbar{display:none}
@media(min-width:1000px){.chips{margin:0;padding-left:0;padding-right:0;flex-wrap:wrap}}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--s1);border:1px solid var(--ln);font-weight:650;font-size:.85rem;color:var(--tx2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--ln2)}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--s2);border:1px solid var(--ln);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:36px;padding:0 16px;border-radius:999px;font-weight:700;font-size:.86rem;color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:var(--shadow)}
.field{width:100%;height:46px;border-radius:13px;border:1px solid var(--ln2);background:var(--s1);padding:0 14px}
textarea.field{height:auto;padding:12px 14px;resize:none}
.field:focus{outline:none;border-color:var(--tx)}
.lab{font-size:.78rem;font-weight:700;color:var(--mu);margin-bottom:6px;display:block}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:.72rem;font-weight:750;background:var(--s2);color:var(--tx2);white-space:nowrap}
.pill.up{background:var(--upbg);color:var(--up)}.pill.dn{background:var(--dnbg);color:var(--dn)}
.rar{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rc)}
.rar::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--rc);border-radius:1px}
.empty{padding:34px 20px;text-align:center;border:1px dashed var(--ln2);border-radius:var(--rad);color:var(--mu);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--tx);font-size:1.02rem}
.empty .btn{margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px;border-radius:var(--rad-s);background:var(--s1);border:1px solid var(--ln)}
.stat b{display:block;font-size:1.3rem;font-stretch:112%;font-weight:800;letter-spacing:-.02em}
.stat small{color:var(--mu);font-size:.76rem;font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ink);transition:width .6s var(--ease)}
.skel{background:linear-gradient(90deg,var(--s2) 0,var(--s3) 50%,var(--s2) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
.grid2{display:grid;gap:16px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}

/* ============ List rows ============ */
.list{background:var(--s1);border:1px solid var(--ln);border-radius:var(--rad);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--ln);transition:background .15s;min-width:0}
.row:last-child{border-bottom:0}
a.row:hover,.row.hov:hover{background:var(--s2)}
.row .i{flex:1;min-width:0}
.row .i b,.row .i small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .i b{font-weight:700}
.row .i small{color:var(--mu);font-size:.8rem}
.row .rk{width:22px;text-align:center;font-weight:800;color:var(--mu2);font-size:.85rem}
.row .val{text-align:right;flex:none}
.row .val b{display:block;font-weight:800}
.thumb{width:46px;height:46px;border-radius:10px;overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);position:relative}
.thumb svg{width:100%;height:100%;display:block}
.thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--rc);opacity:.0}
.thumb.r3::after,.thumb.r4::after{opacity:.9}

/* ============ Packs (shop) ============ */
.hero{position:relative;border-radius:28px;overflow:hidden;background:var(--stage);border:1px solid var(--ln);box-shadow:var(--shadow-lg);display:grid;grid-template-columns:1fr;min-height:420px;isolation:isolate}
.hero .copy{position:relative;z-index:2;padding:26px 24px 24px;display:flex;flex-direction:column;gap:12px;justify-content:flex-end}
.hero .kick{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.hero h1{font-size:clamp(2.1rem,6vw,3.6rem)}
.hero p{color:var(--mu);max-width:420px}
.hero .stage{position:relative;display:grid;place-items:center;padding:30px 0 0;min-height:290px}
.hero .floor{position:absolute;left:50%;bottom:4px;width:62%;height:28px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent);filter:blur(4px);z-index:0}
.hero .dots{display:flex;gap:6px;margin-top:6px}
.hero .dots button{width:7px;height:7px;border-radius:99px;background:var(--ln2);transition:width .3s var(--ease),background .3s}
.hero .dots button.on{width:22px;background:var(--tx)}
.hero .navs{position:absolute;right:16px;top:16px;display:flex;gap:6px;z-index:3}
.hero .navs button{width:38px;height:38px;border-radius:12px;background:var(--s1);border:1px solid var(--ln);display:grid;place-items:center}
.hero .navs svg{width:16px;height:16px}
.hero .ring{position:absolute;width:min(78vw,380px);aspect-ratio:1;border-radius:50%;border:1px solid var(--ln);z-index:0}
.hero .ring.b{width:min(58vw,280px);border-style:dashed;animation:spin 60s linear infinite}
@media(min-width:760px){.hero{grid-template-columns:1.05fr 1fr;min-height:460px}.hero .copy{padding:40px;justify-content:center}.hero .stage{padding:30px 0}}

.pack{--w:150px;position:relative;width:var(--w);aspect-ratio:360/523;transform-style:preserve-3d;transition:transform .35s var(--ease);will-change:transform}
.pack img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 22px rgba(0,0,0,.28)) drop-shadow(0 3px 4px rgba(0,0,0,.2));user-select:none;-webkit-user-drag:none;pointer-events:none}
.pack .sheen{position:absolute;inset:3% 2%;border-radius:6px;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(calc(110deg + var(--px,0)*30deg),transparent 25%,rgba(255,255,255,.85) calc(45% + var(--px,0)*12%),transparent 65%);opacity:.75}
.pack .tint{position:absolute;inset:3% 2%;border-radius:6px;pointer-events:none;mix-blend-mode:color;background:linear-gradient(160deg,hsl(var(--h) 40% 60%),hsl(calc(var(--h) + 40) 40% 40%));opacity:.0}
.pack.float{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{translate:0 -10px}}
.hero .pack{--w:min(46vw,220px);z-index:1}

.shelf{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:6px 16px 14px;scroll-padding:16px}
@media(min-width:1000px){.shelf{margin:0;padding-left:2px;padding-right:2px}}
.ptile{flex:0 0 172px;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;padding:14px 12px 12px;border-radius:22px;background:var(--stage);border:1px solid var(--ln);box-shadow:var(--shadow);text-align:left;position:relative;transition:transform .25s var(--ease),box-shadow .25s}
.ptile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.ptile .pack{--w:100%;margin:0 auto;max-width:132px}
.ptile b{font-stretch:112%;font-weight:800;font-size:.98rem;letter-spacing:-.01em;line-height:1.15}
.ptile small{color:var(--mu);font-size:.76rem}
.ptile .price{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:2px}
.ptile .price span{font-weight:800}
.ptile .go{height:32px;padding:0 12px;border-radius:10px;background:var(--ink);color:var(--on-ink);font-weight:750;font-size:.8rem;display:inline-flex;align-items:center}
.ptile .flag{position:absolute;top:12px;left:12px;z-index:2}
.ptile .dotg{position:absolute;top:16px;right:14px;width:8px;height:8px;border-radius:50%}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pgrid .ptile{flex:none}
.odds{display:flex;flex-direction:column;gap:10px}
.odds .seg5{display:flex;height:10px;border-radius:10px;overflow:hidden;gap:2px}
.odds .seg5 i{display:block;height:100%}
.odds ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px 14px}
.odds li{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.86rem}
.flagfree{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:7px;background:var(--ink);color:var(--on-ink);font-size:.66rem;font-weight:850;letter-spacing:.08em}

/* ============ Trading card ============ */
.tc{--rc:var(--r0);position:relative;width:100%;aspect-ratio:63/88;border-radius:5.2cqw;container-type:inline-size;transform-style:preserve-3d;user-select:none}
.tcw{container-type:inline-size;width:100%}
.tc .face{position:absolute;inset:0;border-radius:6.5cqw;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tc .front{background:#111;padding:3.6cqw;display:flex;flex-direction:column;gap:3cqw;color:#F4F2EC;box-shadow:inset 0 0 0 .8cqw var(--rc),inset 0 0 0 1.4cqw rgba(0,0,0,.6);background:linear-gradient(180deg,#1b1b1a,#0d0d0c)}
.tc.r0 .front{box-shadow:inset 0 0 0 .6cqw rgba(255,255,255,.14),inset 0 0 0 1.2cqw rgba(0,0,0,.5)}
.tc .ft{display:flex;align-items:center;justify-content:space-between;font-size:4.6cqw;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1cqw 2cqw 0}
.tc .ft .rar{font-size:4.6cqw;gap:1.6cqw}
.tc .ft .rar::before{width:2.6cqw;height:2.6cqw}
.tc .ft .no{color:rgba(244,242,236,.5)}
.tc .art{position:relative;flex:1;border-radius:4cqw;overflow:hidden;box-shadow:0 0 0 .4cqw rgba(255,255,255,.08)}
.tc .art svg{position:absolute;inset:0;width:100%;height:100%}
.tc .meta{padding:0 2cqw;display:flex;flex-direction:column;gap:.6cqw}
.tc .meta b{font-size:8.2cqw;font-stretch:115%;font-weight:850;letter-spacing:-.02em;line-height:1.02;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc .meta small{font-size:5cqw;color:rgba(244,242,236,.62);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc .fb{display:flex;justify-content:space-between;align-items:center;padding:2cqw 2cqw 1cqw;border-top:.3cqw solid rgba(255,255,255,.1);font-size:4.6cqw;font-weight:700;color:rgba(244,242,236,.7)}
.tc .fb b{color:#fff;font-weight:850;font-size:5.4cqw}
.tc .holo,.tc .glare{position:absolute;inset:0;border-radius:6.5cqw;pointer-events:none;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tc .holo{mix-blend-mode:color-dodge;opacity:0;background:
  repeating-linear-gradient(calc(115deg + var(--mx,0)*20deg),rgba(255,120,180,.55) 0 4%,rgba(120,200,255,.55) 8%,rgba(170,255,190,.5) 12%,rgba(255,230,140,.55) 16%,rgba(255,120,180,.55) 20%);
  background-size:300% 300%;background-position:calc(50% + var(--mx,0)*40%) calc(50% + var(--my,0)*40%);
  -webkit-mask:linear-gradient(#000,#000);filter:saturate(1.2)}
.tc .glare{background:radial-gradient(circle at calc(50% + var(--mx,0)*50%) calc(50% + var(--my,0)*50%),rgba(255,255,255,.38),transparent 45%);mix-blend-mode:overlay;opacity:.0;transition:opacity .3s}
.tc.r1 .holo{opacity:.12}.tc.r2 .holo{opacity:.22}.tc.r3 .holo{opacity:.36}.tc.r4 .holo{opacity:.48;background:repeating-linear-gradient(calc(115deg + var(--mx,0)*20deg),rgba(255,214,120,.7) 0 4%,rgba(255,250,220,.6) 8%,rgba(214,160,60,.65) 12%,rgba(255,240,190,.6) 16%,rgba(255,214,120,.7) 20%);background-size:300% 300%;background-position:calc(50% + var(--mx,0)*40%) calc(50% + var(--my,0)*40%)}
.tc.live .glare{opacity:1}
.tc.r4 .front{background:linear-gradient(180deg,#221c10,#0e0b06)}
.tc .back{transform:rotateY(180deg);background:#1a1a19}
.tback{position:absolute;inset:0;display:grid;place-items:center;background:
  radial-gradient(circle at 50% 50%,transparent 0 22cqw,rgba(255,255,255,.04) 22.4cqw 23cqw,transparent 23.4cqw),
  repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.035) 0 .5cqw,transparent .5cqw 2.4cqw),
  linear-gradient(155deg,#2b2b29,#121211 55%,#232321);box-shadow:inset 0 0 0 1.4cqw #0b0b0a,inset 0 0 0 1.8cqw rgba(255,255,255,.16)}
.tback .mk{width:34cqw;height:34cqw;border-radius:50%;background:conic-gradient(from 210deg,#d9dce1,#7f858e,#f3f4f6,#8c929b,#d9dce1);box-shadow:0 0 0 1cqw rgba(0,0,0,.4),0 0 6cqw rgba(0,0,0,.6);position:relative}
.tback .mk::after{content:"";position:absolute;inset:10.5cqw;border-radius:50%;background:#151514;box-shadow:inset 0 0 0 1.4cqw rgba(0,0,0,.6)}
.tback span{position:absolute;bottom:10cqw;left:0;right:0;text-align:center;font-size:4cqw;font-weight:800;letter-spacing:.32em;color:rgba(255,255,255,.42);font-stretch:125%}
.tback::before{content:"";position:absolute;inset:0;mix-blend-mode:overlay;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 47%,transparent 62%);background-size:250% 100%;animation:sweep 3.2s ease-in-out infinite}
.tback::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1.2cqw var(--tease,transparent),inset 0 0 10cqw var(--tease,transparent);opacity:var(--teaseo,0);transition:opacity .5s}

/* mini card grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
@media(min-width:700px){.cgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.cgrid a{display:block;transition:transform .25s var(--ease)}
.cgrid a:hover{transform:translateY(-4px) rotate(-.5deg)}
.cgrid .tc{box-shadow:0 10px 20px -12px rgba(0,0,0,.55)}
.cgrid a.miss{opacity:.38;filter:grayscale(1)}

/* song page */
.songtop{display:grid;gap:22px;align-items:start}
@media(min-width:820px){.songtop{grid-template-columns:300px 1fr}}
.songcard{max-width:300px;width:100%;margin:0 auto;perspective:1000px}
.songcard .tc{transition:transform .2s var(--ease);box-shadow:0 30px 50px -26px rgba(0,0,0,.6)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chart{position:relative;height:190px}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .tip{position:absolute;top:0;transform:translateX(-50%);pointer-events:none;background:var(--ink);color:var(--on-ink);font-size:.72rem;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .15s}
.player{display:flex;align-items:center;gap:12px}
.player .pbtn{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.player .pbtn svg{width:18px;height:18px}
.player .prog{flex:1;height:4px;border-radius:4px;background:var(--s3);overflow:hidden}
.player .prog i{display:block;height:100%;width:0;background:var(--ink)}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}
.eq i{width:3px;background:var(--tx);border-radius:2px;height:30%;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{50%{height:100%}}

/* sheet / modal */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(10,10,9,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease both}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--s1);border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg);animation:up .38s var(--ease) both;display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--s3);margin:2px auto 4px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:26px;padding:22px 24px}.sheet .grab{display:none}}
.sheet .shead{display:flex;gap:16px;align-items:center}
.sheet .shead .pack{--w:96px;flex:none}
.sheet h2{font-size:1.4rem}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);z-index:300;background:var(--ink);color:var(--on-ink);padding:11px 16px;border-radius:14px;font-weight:700;font-size:.88rem;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease);max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(min-width:1000px){.toast{bottom:28px}}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:46vh}
.msg{max-width:84%;padding:11px 14px;border-radius:16px;line-height:1.45;font-size:.93rem}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--s1);border:1px solid var(--ln);border-bottom-left-radius:5px}
.msg.ai a{text-decoration:underline;text-underline-offset:3px}
.composer{display:flex;gap:8px;position:sticky;bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media(min-width:1000px){.composer{bottom:16px}}
.composer .field{flex:1}

/* quiz */
.qopts{display:grid;gap:10px}
.qopt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--s1);border:1px solid var(--ln2);text-align:left;font-weight:650;transition:background .2s,border-color .2s,transform .15s}
.qopt:hover{border-color:var(--tx)}
.qopt.ok{background:var(--upbg);border-color:var(--up);color:var(--up)}
.qopt.ko{background:var(--dnbg);border-color:var(--dn);color:var(--dn)}
.qopt kbd{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--s2);font-size:.78rem;font-weight:800;flex:none;font-family:inherit}

/* ============ Opening overlay ============ */
.op{position:fixed;inset:0;z-index:200;overflow:hidden;color:#F4F2EC;background:#0B0B0A;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;animation:fade .4s ease both}
.op .bgl{position:absolute;inset:-20%;background:radial-gradient(50% 42% at 50% 46%,color-mix(in oklab,var(--glow,#8a8a8a) 28%,transparent),transparent 70%);transition:background 1s ease,opacity .6s;opacity:.9}
.op .vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(0,0,0,.75));pointer-events:none}
.op .spot{position:absolute;left:50%;top:-10%;width:120%;height:90%;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(255,255,255,.07) 175deg,rgba(255,255,255,.1) 180deg,rgba(255,255,255,.07) 185deg,transparent 200deg);pointer-events:none;filter:blur(6px)}
.op canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.op .hud{position:absolute;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.op .hud .t{font-size:.72rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(244,242,236,.6)}
.op .hud button{white-space:nowrap;height:36px;padding:0 13px;border-radius:11px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-size:.76rem;font-weight:750;color:#F4F2EC;display:inline-flex;align-items:center;gap:6px}
.op .hud button svg{width:15px;height:15px}
.op .hud button:active{transform:scale(.96)}
.op .center{position:absolute;inset:0;display:grid;place-items:center;z-index:4;perspective:1200px}
.op .zone{position:relative;width:min(64vw,300px);aspect-ratio:63/88}
@media(max-height:640px){.op .zone{width:min(52vw,230px)}}
.op .ptxt{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:0 20px}
.op .hint{font-size:.9rem;font-weight:700;color:rgba(244,242,236,.78);min-height:1.4em;transition:opacity .3s}
.op .hint.pulse{animation:hpulse 1.8s ease-in-out infinite}
@keyframes hpulse{50%{opacity:.4}}
.op .lbl{position:absolute;left:0;right:0;top:calc(13% + env(safe-area-inset-top,0px));text-align:center;z-index:9;pointer-events:none}
.op .lbl b{display:inline-block;font-stretch:125%;font-weight:900;letter-spacing:.14em;font-size:clamp(1.6rem,7vw,2.6rem);color:var(--rc,#fff);text-shadow:0 0 30px color-mix(in oklab,var(--rc,#fff) 60%,transparent)}
.op .lbl small{display:block;margin-top:6px;font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,242,236,.55)}
.op .lbl.go b{animation:lbin .7s var(--spring) both}
.op .lbl.go small{animation:rise .6s .15s var(--ease) both}
.op .lbl.r4 b{color:transparent;background:linear-gradient(90deg,#f6dc93,#fffbe8,#d4a443,#fff6d6,#f6dc93);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;text-shadow:none;filter:drop-shadow(0 0 18px rgba(232,186,90,.7));animation:lbin .9s var(--spring) both,gold 2.4s linear infinite}
@keyframes gold{to{background-position:-300% 0}}
@keyframes lbin{from{opacity:0;transform:scale(.4);letter-spacing:.6em;filter:blur(8px)}}

/* pack in stage */
.op .pk{position:absolute;left:50%;top:50%;width:min(58vw,280px);aspect-ratio:360/523;transform:translate(-50%,-50%) rotateX(calc(var(--py,0)*-10deg)) rotateY(calc(var(--px,0)*14deg));transform-style:preserve-3d;z-index:5;transition:transform .12s linear}
@media(max-height:640px){.op .pk{width:min(46vw,220px)}}
.op .pk.drop{animation:pkdrop 1.1s var(--spring) both}
@keyframes pkdrop{0%{opacity:0;transform:translate(-50%,-140%) rotate(-12deg) scale(.7)}60%{opacity:1}100%{transform:translate(-50%,-50%)}}
.op .pk .bod,.op .pk .strip{position:absolute;inset:0;background-size:100% 100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.op .pk .bod{clip-path:polygon(0 var(--cut),4% calc(var(--cut) + .6%),8% calc(var(--cut) - .4%),12% calc(var(--cut) + .7%),16% calc(var(--cut) - .3%),20% calc(var(--cut) + .5%),24% calc(var(--cut) - .5%),28% calc(var(--cut) + .6%),32% calc(var(--cut) - .2%),36% calc(var(--cut) + .7%),40% calc(var(--cut) - .4%),44% calc(var(--cut) + .4%),48% calc(var(--cut) - .5%),52% calc(var(--cut) + .6%),56% calc(var(--cut) - .3%),60% calc(var(--cut) + .5%),64% calc(var(--cut) - .5%),68% calc(var(--cut) + .7%),72% calc(var(--cut) - .2%),76% calc(var(--cut) + .5%),80% calc(var(--cut) - .4%),84% calc(var(--cut) + .6%),88% calc(var(--cut) - .3%),92% calc(var(--cut) + .5%),96% calc(var(--cut) - .4%),100% var(--cut),100% 100%,0 100%)}
.op .pk .strip{clip-path:polygon(0 0,100% 0,100% var(--cut),96% calc(var(--cut) - .4%),92% calc(var(--cut) + .5%),88% calc(var(--cut) - .3%),84% calc(var(--cut) + .6%),80% calc(var(--cut) - .4%),76% calc(var(--cut) + .5%),72% calc(var(--cut) - .2%),68% calc(var(--cut) + .7%),64% calc(var(--cut) - .5%),60% calc(var(--cut) + .5%),56% calc(var(--cut) - .3%),52% calc(var(--cut) + .6%),48% calc(var(--cut) - .5%),44% calc(var(--cut) + .4%),40% calc(var(--cut) - .4%),36% calc(var(--cut) + .7%),32% calc(var(--cut) - .2%),28% calc(var(--cut) + .6%),24% calc(var(--cut) - .5%),20% calc(var(--cut) + .5%),16% calc(var(--cut) - .3%),12% calc(var(--cut) + .7%),8% calc(var(--cut) - .4%),4% calc(var(--cut) + .6%),0 var(--cut));transform-origin:100% 50%;transition:transform .1s linear}
.op .pk .sheen{position:absolute;inset:2% 1%;mix-blend-mode:soft-light;pointer-events:none;background:linear-gradient(calc(110deg + var(--px,0)*35deg),transparent 25%,rgba(255,255,255,.95) calc(45% + var(--px,0)*14%),transparent 66%);opacity:.8}
.op .pk .seam{position:absolute;left:0;top:calc(var(--cut) - 1.2%);height:2.4%;width:calc(var(--p,0)*100%);background:linear-gradient(90deg,transparent,#fff 70%,#fff);border-radius:4px;filter:blur(1.5px);box-shadow:0 0 18px 4px var(--glow,#fff),0 0 40px 10px color-mix(in oklab,var(--glow,#fff) 50%,transparent);opacity:calc(var(--p,0)*1.4);z-index:3;pointer-events:none}
.op .pk .guide{position:absolute;left:4%;right:4%;top:calc(var(--cut) - .3%);border-top:2px dashed rgba(255,255,255,.55);z-index:2;pointer-events:none;transition:opacity .3s;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
.op .pk .finger{position:absolute;top:calc(var(--cut) - 7%);left:6%;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 8px rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.4);z-index:4;pointer-events:none;animation:swipeh 2.2s var(--ease) infinite}
@keyframes swipeh{0%{transform:translateX(0);opacity:0}15%{opacity:1}70%{transform:translateX(min(44vw,215px));opacity:1}100%{transform:translateX(min(44vw,215px));opacity:0}}
.op .pk.torn .strip{transition:transform .9s cubic-bezier(.2,.7,.3,1),opacity .9s;transform:translate(70%,-160%) rotate(38deg)!important;opacity:0}
.op .pk.torn .guide,.op .pk.torn .finger,.op .pk.torn .seam{opacity:0!important;animation:none}
.op .pk.sink{transition:transform 1s cubic-bezier(.5,0,.75,0),opacity .9s ease-in;transform:translate(-50%,40%) scale(.96);opacity:0}
.op .burst{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;transform:translate(-50%,-50%);pointer-events:none;z-index:3;opacity:0;background:repeating-conic-gradient(from 0deg,color-mix(in oklab,var(--glow,#fff) 40%,transparent) 0 4deg,transparent 4deg 16deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 40%);mask:radial-gradient(circle,#000 0,transparent 40%)}
.op .burst.on{animation:burst 2.6s ease-out both}
.op .burst.loop{opacity:.6;animation:bspin 22s linear infinite}@keyframes bspin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}15%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(30deg)}}
.op .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
.op .flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:var(--fo,.85)}100%{opacity:0}}
.op.shake .center{animation:shake .5s}
@keyframes shake{15%{transform:translate(-8px,4px)}30%{transform:translate(7px,-5px)}45%{transform:translate(-5px,3px)}60%{transform:translate(4px,-3px)}75%{transform:translate(-2px,1px)}}
.op.dim .bgl{opacity:.15}.op.dim .spot{opacity:.3}

/* cards in stage */
.op .deck{position:absolute;inset:0;z-index:4}
.op .dc{position:absolute;inset:0;transition:transform .5s var(--ease),opacity .4s,filter .4s;will-change:transform}
.op .dc .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,1.25,.4,1)}
.op .dc .tc{position:absolute;inset:0}
.op .dc.rev .flip{transform:rotateY(180deg) translateZ(0)}
.op .dc .tc .front{transform:rotateY(180deg)}
.op .dc .tc .back{transform:none}
.op .dc .tc .holo,.op .dc .tc .glare{transform:rotateY(180deg)}
.op .dc.rise{animation:crise 1s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes crise{0%{transform:translateY(60%) scale(.82);opacity:0}40%{opacity:1}}
.op .dc.dtop{filter:drop-shadow(0 30px 40px rgba(0,0,0,.65))}
.op .dc.tremble .flip{animation:tremble .09s linear infinite}
.op .dc.tremble.t2 .flip{animation-duration:.05s}
@keyframes tremble{25%{translate:-2px 1px}50%{translate:2px -1px}75%{translate:-1px -2px}}
.op .dc.hover{animation:hov 3.4s ease-in-out infinite}
@keyframes hov{50%{translate:0 -10px}}
.op .dc.gone{transition:transform .45s cubic-bezier(.5,0,.8,.3),opacity .4s;opacity:0}
.op .hold{position:absolute;left:50%;top:50%;width:132%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:7;opacity:0;transition:opacity .25s;background:conic-gradient(var(--rc,#fff) calc(var(--hp,0)*1turn),rgba(255,255,255,.1) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
.op .hold.on{opacity:1}
.op .shock{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;border:3px solid var(--rc,#fff);pointer-events:none;z-index:7;animation:shock .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes shock{to{transform:scale(16);opacity:0;border-width:1px}}
.op .tray{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:340px;min-height:12px}
.op .tray i{width:22px;height:8px;border-radius:8px;background:rgba(255,255,255,.14);transition:background .3s,transform .3s var(--spring)}

<script>
/* =====================================================================
   SONOWIK — Couche API
   ---------------------------------------------------------------------
   Toute l'interface passe par l'objet `Api`. Deux implémentations :
     • MockApi   : démo locale (localStorage), active quand aucune URL
                   d'API n'est configurée.
     • RemoteApi : appels HTTP JSON vers votre backend.
   Pour brancher votre serveur : Compte › Intégration API, ou
     localStorage.setItem("hm_api", "https://api.exemple.com/v1")
   Authentification : en-tête  Authorization: Bearer <token>.

   CONTRAT (toutes les réponses en JSON) — montants en gemmes ◈ :
   GET    /catalog                      → { genres:[Genre], tracks:[Track], artists:[Artist] }
   GET    /packs                        → [ Pack ]
   GET    /me                           → Me
   GET    /me/notifications             → [ {kind:"sold", trackId, price, buyer, at} ]  (vidée à la lecture)
   POST   /auth/login  {email,password} → { token, me:Me }
   POST   /auth/logout                  → {}
   POST   /packs/:genre/open            → { cards:[trackId ×11], quotes:[Quote], total:float, me:Me }
                                          (règle : total des cotes entre 15 et 50 ◈)
   GET    /market/listings              → [ Listing ]
   GET    /market/quotes                → [ Quote ]   (cotes de toutes les cartes)
   POST   /market/listings {trackId,price} → { listing:Listing, me:Me }   (prix libre, entier ≥ 1)
   DELETE /market/listings/:id          → { me:Me }
   POST   /market/listings/:id/buy      → { me:Me, quote:Quote }
   POST   /collection/:trackId/sell     → { credited:int, me:Me, quote:Quote }   (vente rapide = 70 % de la cote)
   POST   /favorites/:trackId  {on:bool} → { me:Me }
   GET    /tracks/:id/history?days=30   → [ {t:ms, v:float} ]   (cote de clôture par jour + maintenant)
   GET    /tracks/:id/trades            → [ {t:ms, price:int} ]  (dernières transactions)
   POST   /artists/:name/claim          → { credited:int, me:Me }  (5/5 chansons de l'artiste possédées)
   GET    /me/overview?days=30          → { portfolio:[{t,v}] (valeur collection), index:[{t,v}] (indice marché, base 100) }
   GET    /tracks/:id/preview           → { url:string|null }
   GET    /playlists                    → [ Playlist ]
   POST   /playlists {name}             → Playlist
   PATCH  /playlists/:id {name?,tracks?}→ Playlist
   DELETE /playlists/:id                → {}
   GET    /leaderboard?kind=value|pulls|quiz → [ {name,score,me?:bool} ]
   GET    /quiz                         → { questions:[{id,q,options:[string],trackId?}] }
   POST   /quiz/:id/answer {choice:int} → { correct:bool, answer:int, reward:int, me:Me }
   POST   /assistant {message,history}  → { reply:string }   (texte, liens #/…)
   GET    /ledger                       → [ {kind,ref,amount,at} ]
   GET    /challenges                   → [ Challenge ]
   POST   /challenges/:id/start         → { session, timer, pass, rarity, questions:[{id,q,options,trackId?}] }
   POST   /challenges/sessions/:sid/answer {qid,choice} → { correct, answer, late, score }   (chrono vérifié serveur)
   POST   /challenges/sessions/:sid/finish → { score, total, passed, reward:Reward|null, me }  (1 récompense / défi / jour)
   GET    /live/questions?count=10      → [ {q, options, answer} ]   (pour l'hôte d'une partie en direct)
   POST   /live/win {pin,players,score} → { reward:Reward|null, me }  (gagnant ; 3 / jour max)
   POST   /packs/:genre/open {rewardId?} → booster gagné : gratuit, 1 carte de rareté ≥ minRarity garantie

   RÈGLES DE COTE (offre et demande), à reproduire côté serveur :
     achat à un prix p      → cote = max(cote, 0,7·cote + 0,3·p) × 1,04   (la demande fait toujours monter)
     vente rapide           → cote = min(cote, 0,7·cote + 0,3·p) × 0,97   (l'offre fait baisser)
     mise en vente          → cote × 0,99
     sans échange           → retour lent vers la cote de référence
     low / high             → min / max sur 30 j (cotes, transactions, annonces actives)

   TYPES
   Genre    { id, name, hue }
   Artist   { name, genre, tracks:[5 trackId], reward:int }
   Quote    { id, value:float, change:float(%24h), low:float, high:float, base:float }
   Track    { id, title, artist, album, genre, rarity:0-4, no:int, preview_url?, ...Quote }
   Reward   { id, minRarity:0-4, source, at }   (booster gagné, dans Me.rewards)
   Challenge{ id, name, desc, n, timer, pass, rarity, mins, doneToday, best }
   Pack     { genre, price:int, size:int, odds:[5 floats %], valueMin, valueMax }
   Listing  { id, trackId, price:int, seller, mine:bool }
   Playlist { id, name, tracks:[trackId] }
   Me       { name, email?, demo:bool, gems:int, infinite:bool, freePack:bool,
              owned:{trackId:ms}, favs:{trackId:1}, claimed:{artistName:ms}, packsOpened:int, quizBest:int, rewards:[Reward] }
   ===================================================================== */

const RARITIES = ["Commune", "Rare", "Épique", "Mythique", "Légendaire"];
const ODDS = [65, 27, 6, 1.8, 0.2];

const Config = {
  get base() { try { return localStorage.getItem("hm_api") || ""; } catch (e) { return ""; } },
  set base(v) { try { v ? localStorage.setItem("hm_api", v.replace(/\/$/, "")) : localStorage.removeItem("hm_api"); } catch (e) {} },
  get token() { try { return localStorage.getItem("hm_token") || ""; } catch (e) { return ""; } },
  set token(v) { try { v ? localStorage.setItem("hm_token", v) : localStorage.removeItem("hm_token"); } catch (e) {} },
};

class ApiError extends Error { constructor(msg, status) { super(msg); this.status = status; } }

/* ---------------------------- Remote ---------------------------- */
const RemoteApi = (() => {
  async function req(method, path, body) {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(Config.base + path, {
        method, signal: ctl.signal,
        headers: Object.assign({ "Accept": "application/json" }, body ? { "Content-Type": "application/json" } : {}, Config.token ? { "Authorization": "Bearer " + Config.token } : {}),
        body: body ? JSON.stringify(body) : undefined,
      });
      const txt = await r.text(); let data = {}; try { data = txt ? JSON.parse(txt) : {}; } catch (e) {}
      if (!r.ok) throw new ApiError(data.message || data.error || ("Erreur serveur " + r.status), r.status);
      return data;
    } catch (e) {
      if (e.name === "AbortError") throw new ApiError("Le serveur ne répond pas.", 0);
      if (e instanceof ApiError) throw e;
      throw new ApiError("Connexion impossible au serveur.", 0);
    } finally { clearTimeout(to); }
  }
  return {
    remote: true,
    rules: { packMin: 15, packMax: 50, packPrice: 30, quickSell: .7 },
    catalog: () => req("GET", "/catalog"),
    packs: () => req("GET", "/packs"),
    me: () => req("GET", "/me"),
    login: async (email, password) => { const r = await req("POST", "/auth/login", { email, password }); Config.token = r.token; return r; },
    logout: async () => { try { await req("POST", "/auth/logout"); } finally { Config.token = ""; } return {}; },
    openPack: (g, rewardId) => req("POST", "/packs/" + encodeURIComponent(g) + "/open", rewardId ? { rewardId } : undefined),
    challenges: () => req("GET", "/challenges"),
    startChallenge: id => req("POST", "/challenges/" + encodeURIComponent(id) + "/start"),
    answerChallenge: (sid, qid, choice) => req("POST", "/challenges/sessions/" + encodeURIComponent(sid) + "/answer", { qid, choice }),
    finishChallenge: sid => req("POST", "/challenges/sessions/" + encodeURIComponent(sid) + "/finish"),
    liveQuestions: n => req("GET", "/live/questions?count=" + (n || 10)),
    liveWin: body => req("POST", "/live/win", body),
    listings: () => req("GET", "/market/listings"),
    quotes: () => req("GET", "/market/quotes"),
    trades: tid => req("GET", "/tracks/" + encodeURIComponent(tid) + "/trades"),
    notifications: () => req("GET", "/me/notifications"),
    createListing: (trackId, price) => req("POST", "/market/listings", { trackId, price }),
    cancelListing: id => req("DELETE", "/market/listings/" + encodeURIComponent(id)),
    buy: id => req("POST", "/market/listings/" + encodeURIComponent(id) + "/buy"),
    sell: tid => req("POST", "/collection/" + encodeURIComponent(tid) + "/sell"),
    fav: (tid, on) => req("POST", "/favorites/" + encodeURIComponent(tid), { on }),
    claimArtist: name => req("POST", "/artists/" + encodeURIComponent(name) + "/claim"),
    overview: (days = 30) => req("GET", "/me/overview?days=" + days),
    history: (tid, days) => req("GET", "/tracks/" + encodeURIComponent(tid) + "/history?days=" + days),
    preview: tid => req("GET", "/tracks/" + encodeURIComponent(tid) + "/preview"),
    playlists: () => req("GET", "/playlists"),
    createPlaylist: name => req("POST", "/playlists", { name }),
    updatePlaylist: (id, patch) => req("PATCH", "/playlists/" + encodeURIComponent(id), patch),
    deletePlaylist: id => req("DELETE", "/playlists/" + encodeURIComponent(id)),
    leaderboard: kind => req("GET", "/leaderboard?kind=" + kind),
    quiz: () => req("GET", "/quiz"),
    answer: (qid, choice) => req("POST", "/quiz/" + encodeURIComponent(qid) + "/answer", { choice }),
    assistant: (message, history) => req("POST", "/assistant", { message, history }),
    ledger: () => req("GET", "/ledger"),
    setInfinite: async () => { throw new ApiError("Non disponible avec une API réelle.", 400); },

/* ============================ Utils ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const fr = n => String(n).replace(".", ",");
const pct = c => (c >= 0 ? "+" : "−") + fr(Math.abs(c).toFixed(1)) + " %";
const G2 = n => (Math.round(n * 10) / 10).toLocaleString("fr-FR", { maximumFractionDigits: 1 });
/* cote : 1 décimale sous 10 ◈, entier au-delà */
const fv = v => v == null || isNaN(v) ? "—" : v < 10 ? fr((Math.round(v * 10) / 10).toFixed(1)).replace(",0", "") : G2(Math.round(v));
const pad3 = n => String(n).padStart(3, "0");

const Snd = (() => {

    any() { try { if (!c) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; c = new C(); m = c.createGain(); m.gain.value = .9; const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; m.connect(comp); comp.connect(c.destination); } if (c.state !== "running") c.resume(); return c; } catch (e) { return null; } },
    get out() { return m; },

    },
    release() { try { el && el.pause(); } catch (e) {} },

    gem() { [988, 1319, 1976].forEach((f, i) => api.tone(f, i * .06, .35, "sine", .12)); },
  };

})();

const Player = (() => {

    if (a) { const v0 = a.volume, st = performance.now(); const f = () => { const k = (performance.now() - st) / ms; if (k >= 1) { a.pause(); return; } a.volume = v0 * (1 - k); requestAnimationFrame(f); }; f(); }
    setTimeout(() => ns.forEach(n => { try { n.stop(); } catch (e) {} }), ms + 50);
  }
  function stop() { if (cur) Music.duck(false); master = null; nodes.forEach(n => { try { n.stop(); } catch (e) {} }); nodes = []; if (audio) { audio.pause(); audio = null; } cancelAnimationFrame(raf); const was = cur; cur = null; paint(was); }

/* =====================================================================

   • Défis solo : plus c'est long et dur, plus la carte garantie est rare

   • Quiz en direct (multijoueur, code PIN) : le gagnant reçoit un booster

const RW_NAME = ["Rare", "Rare", "Épique", "Mythique", "Légendaire"];

/* ---------------- Boosters gagnés (inventaire) ---------------- */

    try { await open(); L.ready = true; Snd.pop(); hostLobby(); armCountdown(); } catch (e) { paint(`<div class="lvc"><p class="lvp">Impossible de créer la partie : ${esc(e.message || e.type || "réseau")}.</p><button class="lvbtn sm" data-l="quit">Retour</button></div>`); }
  }
  function armCountdown() {
    clearInterval(L.cdT); L.cd = WAIT;
    L.cdT = setInterval(() => {
      if (!L || L.phase !== "lobby") return clearInterval(L && L.cdT);
      if (L.players.size < 1) { L.cd = WAIT; return; }
      L.cd--; const el = root && root.querySelector("#lvcd"); if (el) el.textContent = L.cd;
      if (L.cd <= 3 && L.cd > 0) Snd.tone(660, 0, .08, "square", .04);
      if (L.cd <= 0) { clearInterval(L.cdT); const b = root && root.querySelector("[data-l=start]"); hostStart(b || {}); }
    }, 1000);
  }
  function addBots() {
    const need = Math.max(0, MIN_TABLE - L.players.size), pool = BOTS.slice().sort(() => Math.random() - .5);
    for (let k = 0; k < need; k++) { const [nm, skill] = pool[k]; L.players.set("bot" + k, { id: "bot" + k, name: "Bot " + nm, bot: true, skill, score: 0, tms: 0, streak: 0 }); }
    return need;
  }
  function botsPlay() {
    const q = L.qs[L.i]; L.players.forEach(p => {
      if (!p.bot) return; const ok = Math.random() < p.skill, delay = 1800 + Math.random() * (ok ? 7000 : 10000) * (1.25 - p.skill);
      const c = ok ? q.answer : [0, 1, 2, 3].filter(x => x !== q.answer)[Math.floor(Math.random() * 3)];
      T(() => hostAnswer(p.id, L.i, c), Math.min(LIMIT - 300, delay));
    });
  }
  function hostLobby() { const names = [...L.players.values()].map(p => p.name); others().forEach(p => send(p.conn, { t: "lobby", players: names })); paint(lobbyView()); }
  function onHost(c, m) {
    if (!L || L.role !== "host") return;
    if (m.t === "join") {
      if (L.phase !== "lobby") return send(c, { t: "refused", reason: "La partie a déjà commencé." });
      if (L.players.size >= 30) return send(c, { t: "refused", reason: "Partie complète (30 joueurs)." });
      let name = String(m.name || "Joueur").trim().slice(0, 16) || "Joueur"; const used = new Set([...L.players.values()].map(p => p.name)); let k = 2, base = name; while (used.has(name)) name = base + " " + k++;
      L.players.set(c.peer, { id: c.peer, name, score: 0, tms: 0, streak: 0, conn: c }); send(c, { t: "welcome", name, pin: L.pin }); Snd.tone(988, 0, .1, "triangle", .08); hostLobby();
    } else if (m.t === "ans") hostAnswer(c.peer, m.i, m.c);
  }
  async function hostStart(b) {
    if (!L || L.phase !== "lobby" || L.players.size < 1) return; clearInterval(L.cdT); b.disabled = true; L.phase = "starting";
    try { L.qs = await Api.liveQuestions(N_Q); } catch (e) { b.disabled = false; L.phase = "lobby"; return err(e); }
    const nb = addBots(); if (nb) { const names = [...L.players.values()].map(p => p.name); others().forEach(p => send(p.conn, { t: "lobby", players: names })); toast(nb + " bot" + (nb > 1 ? "s" : "") + " rejoigne" + (nb > 1 ? "nt" : "") + " la partie"); }
    L.i = -1; L.phase = "q"; hostNext();
  }
  function hostNext() {
    L.i++; if (L.i >= L.qs.length) return hostEnd();
    const q = L.qs[L.i]; L.phase = "q"; L.qStart = Date.now(); L.players.forEach(p => { p.ans = null; p.ms = LIMIT; });
    L.cur = { i: L.i, n: L.qs.length, q: q.q, options: q.options, deadline: Date.now() + LIMIT };
    others().forEach(p => send(p.conn, { t: "q", i: L.i, n: L.qs.length, q: q.q, options: q.options, ms: LIMIT }));
    Snd.tone(523, 0, .1, "triangle", .1); Snd.tone(784, .1, .16, "triangle", .1);
    hostPaintQ(); runClock(L.cur.deadline); botsPlay(); T(hostReveal, LIMIT + 400);
  }
  function hostPaintQ() { const tot = L.players.size, cnt = [...L.players.values()].filter(p => p.ans != null).length; const me = L.players.get("host"); paint(qView(L.cur, { canAnswer: !!me && me.ans == null, answered: !!me && me.ans != null && false, count: cnt, total: tot })); if (me && me.ans != null) root.querySelectorAll("[data-l^=ans]").forEach(x => { x.disabled = true; x.classList.toggle("pick", +x.dataset.l.split(":")[1] === me.ans); }); }
  function hostAnswer(id, i, c) {
    if (L.phase !== "q" || i !== L.i) return; const p = L.players.get(id); if (!p || p.ans != null) return;

  }
  function hostReveal() {

    const q = L.qs[L.i], dist = [0, 0, 0, 0];

    const R = ranking(), top = R.slice(0, 5).map(p => ({ name: p.name, score: p.score, bot: !!p.bot })), base = { t: "reveal", i: L.i, n: L.qs.length, q: q.q, options: q.options, answer: q.answer, top, players: R.length };
    R.forEach((p, k) => { const you = { correct: p.ok, answered: p.ans != null && p.ans >= 0, gained: p.gained, score: p.score, rank: k + 1 }; if (p.conn) send(p.conn, Object.assign({ you }, base)); else if (p.id === "host") L.myYou = you; });
    const hp = L.players.get("host"); hp && hp.ok ? Snd.coins(3) : Snd.tone(300, 0, .2, "triangle", .06);

  }
  function hostEnd() {
    L.phase = "end"; clearInterval(clockT); const R = ranking(), podium = R.slice(0, 3).map(p => ({ name: p.name, score: p.score, bot: !!p.bot })), n = R.length;
    R.forEach((p, k) => { const msg = { t: "end", podium, winner: R[0].name, players: n, pin: L.pin, you: { rank: k + 1, score: p.score, winner: k === 0 } }; if (p.conn) send(p.conn, msg); });
    const k = R.findIndex(p => p.id === "host"), e = { podium, winner: R[0].name, players: n, you: k >= 0 ? { rank: k + 1, score: R[k].score, winner: k === 0 } : null };
    fanfare(); paint(endView(e)); if (e.you && e.you.winner) claim(n, e.you.score);
  }

  /* ---------- Joueur ---------- */
  async function join(pin, name) {
    await loadPeer(); clearT(); pin = String(pin).replace(/\D/g, "");
    if (pin.length !== 6) throw new Error("Le code fait 6 chiffres.");
    L = { role: "player", pin, name, players: new Map(), phase: "joining" };
    paint(`<div class="lvc"><div class="lvwait"><i></i><i></i><i></i></div><p class="lvp">Connexion à la partie ${pin}…</p></div>`);
    const p = new Peer(peerOpts()); L.peer = p;
    const fail = msg => { if (!L || L.phase !== "joining") return; L.phase = "failed"; paint(`<div class="lvc"><p class="lvp">${esc(msg)}</p><button class="lvbtn sm" data-l="again">Réessayer</button></div>`); };
    T(() => fail("Partie introuvable. Vérifie le code et que l'hôte est toujours sur l'écran de la partie."), 12000);
    p.on("error", e => fail(e.type === "peer-unavailable" ? "Aucune partie avec ce code." : "Connexion impossible (" + (e.type || "réseau") + ")."));
    p.on("open", () => {
      const c = p.connect(PREFIX + pin, { reliable: true }); L.conn = c;
      c.on("open", () => send(c, { t: "join", name }));
      c.on("data", onPlayer);
      c.on("close", () => { if (L && L.phase !== "end" && L.role === "player") paint(`<div class="lvc"><p class="lvp">L'hôte a quitté la partie.</p><button class="lvbtn sm" data-l="quit">Retour</button></div>`); });
    });
  }
  function onPlayer(m) {
    if (!L || L.role !== "player") return;
    if (m.t === "refused") { L.phase = "failed"; clearT(); paint(`<div class="lvc"><p class="lvp">${esc(m.reason)}</p><button class="lvbtn sm" data-l="quit">Retour</button></div>`); }
    else if (m.t === "welcome") { clearT(); L.name = m.name; L.phase = "lobby"; Snd.pop(); paint(lobbyView()); }
    else if (m.t === "lobby") { L.lobby = m.players; if (L.phase === "lobby") paint(lobbyView()); }
    else if (m.t === "q") { L.phase = "q"; L.cur = { i: m.i, n: m.n, q: m.q, options: m.options, deadline: Date.now() + m.ms }; L.answered = false; Snd.tone(523, 0, .1, "triangle", .1); Snd.tone(784, .1, .16, "triangle", .1); paint(qView(L.cur, { canAnswer: true })); runClock(L.cur.deadline); }
    else if (m.t === "reveal") { L.phase = "reveal"; clearInterval(clockT); m.you.correct ? Snd.coins(3) : Snd.tone(220, 0, .3, "sawtooth", .05, 140); paint(revealView(m)); }
    else if (m.t === "end") { L.phase = "end"; fanfare(); paint(endView(m)); if (m.you && m.you.winner) claim(m.players, m.you.score); }
  }
  function answer(i) {
    if (!L || L.phase !== "q") return; Snd.tap();
    if (L.role === "host") { const me = L.players.get("host"); if (!me || me.ans != null) return; hostAnswer("host", L.i, i); return; }
    if (L.answered) return; L.answered = true; send(L.conn, { t: "ans", i: L.cur.i, c: i }); paint(qView(L.cur, { answered: true }));
  }

  /* ---------- Récompense & fin ---------- */
  async function claim(players, score) {
    const el = () => root && root.querySelector("#lvprize");
    try {
      const r = await Api.liveWin({ pin: L.pin, players, score }); setMe(r.me);
      if (el()) el().innerHTML = r.reward ? `<div class="rwbig" style="--rc:${RC[4]}"><span class="rgem"></span><b>Tu as gagné ! ${rwLabel(r.reward)}</b></div><button class="lvbtn" data-l="open:${r.reward.id}">Ouvrir mon booster</button>`
        : `<p class="lvp">Tu as gagné ! Mais tu as déjà reçu ${3} boosters de victoire aujourd'hui : reviens demain.</p>`;
      if (r.reward) { Snd.coins(10); setTimeout(() => Snd.gem(), 500); }

  }
  function fanfare() { [523, 659, 784, 1047].forEach((f, i) => Snd.tone(f, i * .13, .5, "triangle", .1)); }
  function leave(nav) {

    if (L) { try { L.role === "host" ? others().forEach(p => p.conn.close()) : L.conn && L.conn.close(); } catch (e) {} try { L.peer && L.peer.destroy(); } catch (e) {} }
    L = null; if (root) { root.remove(); root = null; Music.hold(false); } document.body.style.overflow = "";
    if (nav) render(false);

})();

/* =====================================================================
   MUSIQUE D'AMBIANCE (générée en direct, jamais la même boucle)
   • « Lounge »   : partout dans l'appli — lo-fi doux, accords jazzy, crépitement vinyle
   • « Boutique » : Boosters et Marché — plus entraînant, marimba, basse rebondissante
   Activable uniquement dans Compte › Réglages (désactivée par défaut).
   Se met en sourdine pendant l'ouverture d'un booster, le quiz en direct
   et la lecture d'un extrait ; s'arrête quand l'onglet est caché.
   ===================================================================== */
const Music = (() => {
  let bus = null, theme = null, want = "app", holds = 0, ducked = false, timer = 0, noiseBuf = null;
  const on = () => !!Prefs.get("music");
  const vol = () => { const v = Prefs.get("musicVol"); return (v == null ? .6 : +v) * .9; };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const rnd = a => a[Math.floor(Math.random() * a.length)];

  function ctx() { const c = Snd.any(); if (!c) return null; if (!bus) { bus = c.createGain(); bus.gain.value = 0; bus.connect(c.destination); } return c; }
  function noise(c) { if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } const s = c.createBufferSource(); s.buffer = noiseBuf; return s; }
  const target = () => (on() && !holds && !document.hidden ? (ducked ? vol() * .15 : vol()) : 0);
  function level(tc = .6) { const c = ctx(); if (c && bus) bus.gain.setTargetAtTime(target(), c.currentTime, tc); }

  /* ---------- instruments ---------- */
  function env(c, dest, t, a, d, peak) { const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0005, t + a + d); g.connect(dest); return g; }
  function keys(c, out, t, midi, dur, v) { // piano électrique doux
    const f = mtof(midi), g = env(c, out, t, .012, dur, v);
    [[1, "sine", 1], [2, "sine", .18], [1.003, "triangle", .35]].forEach(([m, type, a]) => { const o = c.createOscillator(), og = c.createGain(); o.type = type; o.frequency.value = f * m; og.gain.value = a; o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + .1); });
  }
  function bass(c, out, t, midi, dur, v, type = "sine") { const o = c.createOscillator(), g = env(c, out, t, .01, dur, v); o.type = type; o.frequency.value = mtof(midi); o.connect(g); o.start(t); o.stop(t + dur + .05); }
  function mallet(c, out, t, midi, v) { const f = mtof(midi), g = env(c, out, t, .003, .45, v); [[1, 1], [4, .25], [9.2, .05]].forEach(([m, a]) => { const o = c.createOscillator(), og = c.createGain(); o.type = "sine"; o.frequency.value = f * m; og.gain.value = a; o.connect(og); og.connect(g); o.start(t); o.stop(t + .5); }); }
  function kick(c, out, t, v) { const o = c.createOscillator(), g = env(c, out, t, .002, .28, v); o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + .14); o.connect(g); o.start(t); o.stop(t + .32); }
  function hiss(c, out, t, dur, v, f, type = "highpass") { const s = noise(c), fl = c.createBiquadFilter(), g = env(c, out, t, .002, dur, v); fl.type = type; fl.frequency.value = f; s.connect(fl); fl.connect(g); s.start(t, Math.random()); s.stop(t + dur + .05); }

  /* ---------- thèmes ---------- */
  const THEMES = {
    app: { bpm: 74, steps: 8, swing: .14, cut: 2300, gain: 1,
      progs: [[[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]], [[57, 60, 64, 67], [53, 57, 60, 64], [48, 52, 55, 59], [55, 59, 62, 64]], [[50, 53, 57, 60], [55, 59, 62, 65], [48, 52, 55, 59], [57, 60, 64, 67]], [[52, 55, 59, 62], [57, 60, 64, 67], [50, 53, 57, 60], [55, 59, 62, 65]]],
      scale: [72, 74, 76, 79, 81, 84],
      step(c, out, t, s, bar, ch, st) {
        const b = 60 / this.bpm / 2;
        if (s === 0) { ch.forEach((m, k) => keys(c, out, t + k * .018, m, b * 7, .055)); bass(c, out, t, ch[0] - 12, b * 3, .2); }
        if (s === 5 && Math.random() < .6) bass(c, out, t, ch[0] - 12 + (Math.random() < .5 ? 7 : 0), b * 2, .14);
        if (s === 0 || (s === 5 && Math.random() < .5)) kick(c, out, t, .32);
        if (s === 2 || s === 6) hiss(c, out, t, .16, .05, 1800, "bandpass");
        if (s % 2 === 1 && Math.random() < .55) hiss(c, out, t, .04, .018, 7000);
        if (Math.random() < (s % 2 ? .12 : .22)) { st.mel = Math.max(0, Math.min(this.scale.length - 1, (st.mel ?? 2) + rnd([-2, -1, 1, 2]))); keys(c, st.echo, t, this.scale[st.mel], b * 2.5, .045); }
      } },
    shop: { bpm: 104, steps: 16, swing: .05, cut: 5200, gain: .9,
      progs: [[[53, 57, 60], [48, 52, 55], [50, 53, 57], [46, 50, 53]], [[46, 50, 53], [53, 57, 60], [48, 52, 55], [50, 53, 57]], [[53, 57, 60], [45, 48, 52], [46, 50, 53], [48, 52, 55]]],
      step(c, out, t, s, bar, ch, st) {
        const b = 60 / this.bpm / 4;
        if (s % 4 === 0) kick(c, out, t, .3);
        if (s === 4 || s === 12) hiss(c, out, t, .12, .07, 1500, "bandpass");
        if (s % 2 === 1) hiss(c, out, t, .03, .02, 8000);
        const bp = [0, 0, 12, 0, 0, 12, 0, 7]; if (s % 2 === 0) bass(c, out, t, ch[0] - 12 + bp[(s / 2) % 8], b * 1.6, .17, "triangle");
        if (s === 0) ch.forEach((m, k) => keys(c, out, t + k * .01, m + 12, b * 14, .03));
        const arp = [0, 1, 2, 1, 2, 3, 2, 1], tones = ch.concat(ch[0] + 12);
        if (Math.random() < (s % 2 ? .45 : .8)) mallet(c, st.echo, t, tones[arp[s % 8] % tones.length] + 12, .06);
        if (bar % 4 === 3 && s === 14) [0, 1, 2, 3].forEach(k => mallet(c, st.echo, t + k * .045, tones[k % tones.length] + 24, .035));
      } },
  };

  function startTheme(name) {
    const c = ctx(); if (!c) return null; const T = THEMES[name], g = c.createGain(), lp = c.createBiquadFilter(), dl = c.createDelay(), fb = c.createGain(), wet = c.createGain();
    g.gain.value = 0; g.gain.setTargetAtTime(T.gain, c.currentTime, 1); lp.type = "lowpass"; lp.frequency.value = T.cut; lp.connect(g); g.connect(bus);
    dl.delayTime.value = 60 / T.bpm * .75; fb.gain.value = .3; wet.gain.value = .3; const echo = c.createGain(); echo.connect(lp); echo.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(lp);
    let crackle = null; if (name === "app") { crackle = noise(c); crackle.loop = true; const bp = c.createBiquadFilter(), cg = c.createGain(); bp.type = "highpass"; bp.frequency.value = 3000; cg.gain.value = .012; crackle.connect(bp); bp.connect(cg); cg.connect(g); crackle.start(); }
    return { name, T, g, lp, out: lp, st: { echo }, next: c.currentTime + .15, s: 0, bar: 0, prog: rnd(T.progs), crackle };
  }
  function stopTheme(th, fade = 1.6) { const c = ctx(); if (!th || !c) return; th.g.gain.cancelScheduledValues(c.currentTime); th.g.gain.setTargetAtTime(0, c.currentTime, fade / 3); setTimeout(() => { try { th.g.disconnect(); th.crackle && th.crackle.stop(); } catch (e) {} }, fade * 1000 + 300); }
  function tick() {
    const c = ctx(); if (!c || !theme || !on() || holds || document.hidden) return;
    const th = theme, T = th.T, stepDur = 60 / T.bpm / (T.steps / 4);
    if (th.next < c.currentTime - .2) th.next = c.currentTime + .05;
    while (th.next < c.currentTime + .3) {
      if (th.s === 0 && th.bar % 4 === 0 && th.bar) { let p; do p = rnd(T.progs); while (p === th.prog && T.progs.length > 1); th.prog = p; }
      const ch = th.prog[th.bar % 4], sw = th.s % 2 ? T.swing * stepDur * 2 : 0;
      try { T.step(c, th.out, th.next + sw, th.s, th.bar, ch, th.st); } catch (e) {}
      th.next += stepDur; th.s++; if (th.s >= T.steps) { th.s = 0; th.bar++; }
    }
  }
  function sync() {
    if (!on()) { if (theme) { stopTheme(theme, .8); theme = null; } level(.2); clearInterval(timer); timer = 0; return; }
    const c = ctx(); if (!c) return; if (c.state !== "running") c.resume();
    if (!theme || theme.name !== want) { const old = theme; theme = startTheme(want); stopTheme(old); }
    if (!timer) timer = setInterval(tick, 60);
    level(1.2);
  }
  document.addEventListener("visibilitychange", () => level(.3));
  return {
    sync,
    route(p) { want = (p === "boosters" || p === "marche" || p.startsWith("booster/")) ? "shop" : "app"; if (on()) sync(); },
    hold(v) { holds = Math.max(0, holds + (v ? 1 : -1)); level(v ? .25 : 1.2); },
    duck(v) { ducked = !!v; level(.3); },
    volume() { level(.15); },
    get theme() { return theme && theme.name; },
    get _bus() { return bus; },
  };
})();

</script>
